<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <link rel="stylesheet" href="global-config.css" />
  <title data-i18n="globalConfig.title">全局配置</title>
</head>
<body>
  <div class="modal">
    <div class="modal-body">
      <section class="field-group">
        <label class="field-label" data-i18n="globalConfig.language">语言</label>
        <select id="langSel"></select>
      </section>

      <section class="field-group">
        <div class="row">
          <div class="row-text">
            <span class="row-title" data-i18n="globalConfig.launchOnStartup">开机启动</span>
            <span class="row-desc" data-i18n="globalConfig.launchDesc">登录 Windows 后自动运行桌面便签</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="launchOnStartup" />
            <span class="track"><span class="thumb"></span></span>
          </label>
        </div>
      </section>

      <section class="field-group">
        <label class="field-label" data-i18n="globalConfig.theme">主题</label>
        <div class="seg" id="themeSeg">
          <button data-theme="light" data-i18n="globalConfig.themeLight">浅色</button>
          <button data-theme="dark" data-i18n="globalConfig.themeDark">深色</button>
          <button data-theme="system" data-i18n="globalConfig.themeSystem">跟随系统</button>
        </div>
        <p class="hint" data-i18n="globalConfig.themeHint">切换后所有配置窗口即时生效</p>
      </section>

      <section class="field-group">
        <label class="field-label" data-i18n="globalConfig.defaults">新便签默认值</label>

        <div class="row">
          <div class="row-text">
            <span class="row-title" data-i18n="globalConfig.defaultFontSize">默认字号</span>
            <span class="row-desc" data-i18n="globalConfig.defaultFontSizeDesc">新建文本便签的初始字号</span>
          </div>
          <input type="number" id="defaultFontSize" min="10" max="72" class="num" />
        </div>

        <div class="row col">
          <div class="row-text">
            <span class="row-title" data-i18n="globalConfig.defaultOpacity">默认透明度 <span class="val" id="opacityVal">95%</span></span>
            <span class="row-desc" data-i18n="globalConfig.defaultOpacityDesc">新建便签的初始透明度</span>
          </div>
          <input type="range" id="defaultOpacity" min="20" max="100" step="1" class="range" />
        </div>

        <div class="row">
          <div class="row-text">
            <span class="row-title" data-i18n="globalConfig.defaultBg">默认背景色</span>
          </div>
          <label class="color-pick">
            <input type="color" id="defaultBgColor" />
            <span class="swatch" id="bgSwatch"></span>
          </label>
        </div>

        <div class="row">
          <div class="row-text">
            <span class="row-title" data-i18n="globalConfig.defaultText">默认文字色</span>
          </div>
          <label class="color-pick">
            <input type="color" id="defaultTextColor" />
            <span class="swatch" id="textSwatch"></span>
          </label>
        </div>
      </section>
    </div>

    <footer class="modal-foot">
      <span class="foot-hint" data-i18n="globalConfig.savedHint">设置即时保存</span>
    </footer>
  </div>

  <script src="global-config.js"></script>
</body>
</html>
