<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <link rel="stylesheet" href="about.css" />
  <title data-i18n="about.title">关于</title>
</head>
<body>
  <div class="modal">
    <div class="modal-body">
      <div class="hero">
        <div class="app-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 3H5a1 1 0 0 0-1 1v16l4-3h11a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1z"/>
            <path d="M8 8h8"/>
            <path d="M8 12h5"/>
          </svg>
        </div>
        <div class="app-name" id="appName" data-i18n="app.name">桌面便签</div>
        <div class="app-id" id="appId">desktop-notes</div>
      </div>

      <div class="info-list">
        <div class="info-row">
          <span class="info-label" data-i18n="about.version">版本</span>
          <span class="info-value" id="version">-</span>
        </div>
        <div class="info-row">
          <span class="info-label" data-i18n="about.releaseDate">发布时间</span>
          <span class="info-value" id="releaseDate">-</span>
        </div>
      </div>

      <div class="link-list">
        <button class="link-row" id="linkWebsite">
          <svg class="link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/>
          </svg>
          <span class="link-text" data-i18n="about.website">介绍网站</span>
          <svg class="link-ext" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 4h6v6"/><path d="M20 4L10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
          </svg>
        </button>
        <button class="link-row" id="linkGithub">
          <svg class="link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 19c-4 1.5-4-2.5-6-3m12 5v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 5.9-1.5 5.9-6.6A5 5 0 0 0 18.8 4a4.7 4.7 0 0 0-.1-3.5s-1.4-.4-4.5 1.7a12.3 12.3 0 0 0-6.4 0C4.7.1 3.3.5 3.3.5A4.7 4.7 0 0 0 3.2 4a5 5 0 0 0-1.4 3.5c0 5 2.9 6.3 5.9 6.6a3.4 3.4 0 0 0-.9 2.5V21"/>
          </svg>
          <span class="link-text" data-i18n="about.github">GitHub</span>
          <svg class="link-ext" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 4h6v6"/><path d="M20 4L10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
          </svg>
        </button>
      </div>

      <div class="tech" id="tech"></div>
      <div class="copyright" id="copyright"></div>
    </div>
  </div>

  <script src="about.js"></script>
</body>
</html>
