<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' noteimg: data:; frame-src https: http:; child-src https: http:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <link rel="stylesheet" href="note.css" />
  <title>note</title>
</head>
<body>
  <div id="card" class="card locked">
    <!-- 文本便签工具栏 -->
    <div id="toolbar" class="toolbar text-toolbar" hidden>
      <span class="drag-handle" title="拖动">⠿</span>
      <button data-cmd="bold" title="加粗"><b>B</b></button>
      <button data-cmd="italic" title="斜体"><i>I</i></button>
      <button data-cmd="insertUnorderedList" title="列表">•</button>
      <button data-cmd="createLink" title="链接">🔗</button>
      <button data-cmd="insertImage" title="插入图片">🖼️</button>
      <input type="color" id="fg" title="文字色" />
      <button id="lockBtn" class="lock-btn no-drag" title="锁定">锁定</button>
    </div>

    <!-- 网页便签工具栏 -->
    <div id="webToolbar" class="toolbar web-toolbar" hidden>
      <span class="drag-handle" title="拖动">⠿</span>
      <input type="text" id="urlInput" class="url-input" placeholder="输入网址，如 https://…" />
      <button id="goBtn" class="no-drag" title="前往">前往</button>
      <button id="reloadBtn" class="no-drag" title="刷新">⟳</button>
      <button id="webLockBtn" class="lock-btn no-drag" title="锁定">锁定</button>
    </div>

    <!-- 文本编辑区 -->
    <div id="content" class="content" spellcheck="false"></div>

    <!-- 网页展示区 -->
    <webview id="webview" class="webview" allowpopups hidden></webview>
  </div>
  <script src="note.js"></script>
</body>
</html>
